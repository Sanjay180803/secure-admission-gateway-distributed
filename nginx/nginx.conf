# Round-robins traffic across every gateway replica. Clients talk to ONE
# address (this nginx); they never need to know how many replicas exist
# or which one handled their last request -- that's exactly what makes
# the replicas safely interchangeable now that correctness-critical state
# (budget, outstanding credits, spent nonces, trust) lives in Redis rather
# than in any single replica's memory.

events {
    worker_connections 1024;
}

http {
    upstream gateway_replicas {
        # default nginx load-balancing strategy is round-robin
        server replica-a:8000;
        server replica-b:8000;
        server replica-c:8000;
        server replica-d:8000;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://gateway_replicas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
    }
}
