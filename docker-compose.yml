x-replica-common: &replica_common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    COORDINATION_MODE: "coordinated"
    REDIS_URL: "redis://redis:6379/0"
    SERVER_SECRET: "dev-only-secret-change-me"
    BACKEND_URL: "http://backend:8000"
  depends_on: [redis, backend]

services:
  # --- persistence: AOF (append-only file) means the shared ledger
  # (budget, outstanding credits, spent nonces, trust scores) survives a
  # Redis restart, not just a replica restart. A named volume keeps the
  # AOF file on disk across container recreation, not just process life.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports: ["6379:6379"]

  # the real service being protected
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_ID: "backend-1"
      MAX_CONCURRENT_WORK: "5"
    ports: ["7000:8000"]

  replica-a:
    <<: *replica_common
    environment:
      REPLICA_ID: "replica-a"
      COORDINATION_MODE: "coordinated"
      REDIS_URL: "redis://redis:6379/0"
      SERVER_SECRET: "dev-only-secret-change-me"
      BACKEND_URL: "http://backend:8000"
    ports: ["9001:8000"]

  replica-b:
    <<: *replica_common
    environment:
      REPLICA_ID: "replica-b"
      COORDINATION_MODE: "coordinated"
      REDIS_URL: "redis://redis:6379/0"
      SERVER_SECRET: "dev-only-secret-change-me"
      BACKEND_URL: "http://backend:8000"
    ports: ["9002:8000"]

  replica-c:
    <<: *replica_common
    environment:
      REPLICA_ID: "replica-c"
      COORDINATION_MODE: "coordinated"
      REDIS_URL: "redis://redis:6379/0"
      SERVER_SECRET: "dev-only-secret-change-me"
      BACKEND_URL: "http://backend:8000"
    ports: ["9003:8000"]

  replica-d:
    <<: *replica_common
    environment:
      REPLICA_ID: "replica-d"
      COORDINATION_MODE: "coordinated"
      REDIS_URL: "redis://redis:6379/0"
      SERVER_SECRET: "dev-only-secret-change-me"
      BACKEND_URL: "http://backend:8000"
    ports: ["9004:8000"]

  # single entrypoint clients actually talk to -- round-robins across
  # all 4 replicas. This is the address a real client would use; the
  # individual replica ports above (9001-9004) are for local debugging
  # only (checking one replica's dashboard directly).
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8000:8000"]
    depends_on: [replica-a, replica-b, replica-c, replica-d]

volumes:
  redis-data:
